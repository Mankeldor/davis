name: Release

# A tag of this fork (vX.Y.Z-st2.N) releases it: the archive of the tag, its checksum and a
# page that says how to install and update. The steps are scripts in .github/release, so they
# can be run before tagging (see RELEASE.md).
#
# A run that failed can be repeated for the same tag with "Run workflow", without moving the
# tag. Repeating a run that succeeded uploads the same files again and rewrites the page.

on:
  push:
    tags:
      - 'v*-st2.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to release, for example v5.6.3-st2.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # First, and on its own: without a changelog section for the version the release page would
  # say nothing, and at this point nothing is published and the tag can still be taken back.
  check:
    name: Changelog and version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check that the tag can be released
        run: sh .github/release/check.sh "$TAG"

  # The same steps as the PHPUnit job of the CI, for the PHP and the database an install from
  # the archive is most likely to run on. A tag whose tests fail is not released.
  tests:
    name: PHPUnit (PHP 8.4, mysql)
    needs: check
    runs-on: ubuntu-24.04
    container:
      image: php:8.4-alpine
      options: >-
        --tmpfs /tmp:exec
        --tmpfs /var/tmp:exec
    services:
      mysql:
        image: mariadb:10.11
        env:
          # Corresponds to what is in .env.test
          MYSQL_DATABASE: davis_test
          MYSQL_USER: davis
          MYSQL_PASSWORD: davis
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
    env:
      COMPOSER_ALLOW_SUPERUSER: '1'
      SYMFONY_DEPRECATIONS_HELPER: max[self]=0
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: test
    steps:
      # Before the checkout, and that is the point. The PHP image has no git, and without git
      # actions/checkout does not clone: it downloads an archive of the tag instead. That
      # archive honours .gitattributes, so everything marked export-ignore is missing from
      # it, and that is the tests, their configuration and .env.test.
      - name: Install git
        run: apk add --no-cache git

      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      # PHPUnit without its configuration prints its help and fails without saying why. If
      # the checkout ever comes without the tests again, this says so.
      - name: Check that the tests were checked out
        run: |
          missing=""
          for f in phpunit.xml.dist .env.test tests/bootstrap.php; do
            [ -e "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "ERROR: These paths are missing from the checkout:$missing"
            echo "       They are marked export-ignore in .gitattributes, so they are missing"
            echo "       when the checkout is an archive and not a clone. actions/checkout"
            echo "       falls back to an archive when there is no git in the container."
            exit 1
          fi
          echo "--> The tests and their configuration are there."

      - name: Install MySQL / GD / ZIP / LDAP PHP extensions
        run: |
          apk add $PHPIZE_DEPS icu-libs icu-dev libpng-dev libzip-dev openldap-dev
          docker-php-ext-configure intl
          docker-php-ext-configure gd
          docker-php-ext-configure zip
          docker-php-ext-install pdo pdo_mysql intl gd zip ldap

      - name: Install Composer
        run: wget -qO - https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer --quiet

      - name: Install dependencies with Composer
        run: composer install --no-progress --no-interaction --ansi

      - name: Run tests with PHPUnit (MySQL)
        env:
          DATABASE_URL: mysql://davis:davis@mysql:3306/davis_test
        run: vendor/bin/phpunit --process-isolation --colors=always

  release:
    name: Archive and release page
    needs: [check, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check that the tag can be released
        run: sh .github/release/check.sh "$TAG"

      # The archive is checked in both directions before it is packed, and the run stops
      # there if a file is missing or one is in it that should not be.
      - name: Build the archive and its checksum
        run: sh .github/release/build-package.sh "$TAG"

      - name: Write the release notes
        run: |
          sh .github/release/release-notes.sh "$TAG"
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # With the token of this run, which can only write to this repository. The notes are
      # handed over as a file: as an argument, every backtick in them would be run by the shell.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="davis-${TAG}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/${NAME}.tar.gz" "dist/${NAME}.tar.gz.sha256" --clobber
            gh release edit "$TAG" --title "Davis ${TAG#v}" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" "dist/${NAME}.tar.gz" "dist/${NAME}.tar.gz.sha256" \
              --verify-tag --title "Davis ${TAG#v}" --notes-file dist/release-notes.md
          fi

monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: error
            handler: nested
            excluded_http_codes: [404, 405]
            buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            channels: ["!api"]
        nested:
            type: stream
            path: "%env(resolve:LOG_FILE_PATH)%"
            level: debug
        # Users created or deleted over the API. `main` only writes when a request fails, and
        # these lines are the record of the requests that succeeded.
        api:
            type: stream
            path: "%env(resolve:LOG_FILE_PATH)%"
            level: notice
            channels: ["api"]
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine"]
